name: Arsenal CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: |
          cd stacks/01-nodejs-express
          npm install
      - name: Run server & smoke test
        run: |
          cd stacks/01-nodejs-express
          node src/server.js > node.log 2>&1 &
          for i in {1..30}; do
            if curl -s http://127.0.0.1:5000/api/health | grep -q "healthy"; then
              echo "Node.js server ready!"
              break
            fi
            sleep 1
          done
          cat node.log
          node ../../shared/smoke-test/smoke.mjs http://127.0.0.1:5000

  test-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Setup Node.js for smoke runner
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: |
          cd stacks/02-python-fastapi
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Run server & smoke test
        run: |
          cd stacks/02-python-fastapi
          python -m uvicorn app.main:app --host 127.0.0.1 --port 5000 > uvicorn.log 2>&1 &
          for i in {1..30}; do
            if curl -s http://127.0.0.1:5000/api/health | grep -q "healthy"; then
              echo "FastAPI server ready!"
              break
            fi
            sleep 1
          done
          cat uvicorn.log
          node ../../shared/smoke-test/smoke.mjs http://127.0.0.1:5000
